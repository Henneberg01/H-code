<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-Code native persistent todo application</title>
<style>
body{font:1rem system-ui;margin:2rem auto;max-width:38rem;padding:0 1rem;line-height:1.6}
label{display:block;margin-bottom:.4rem}
input{font:inherit;padding:.6rem;width:100%;box-sizing:border-box}
button{font:inherit;padding:.55rem .8rem;margin:.5rem .3rem .5rem 0}
li{padding:.2rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>H-Code persistent tasks</h1>
  <p>Enter a task name. Select Add, Complete or Remove to update that exact task.</p>
  <label for="todo-input">Task name</label>
  <input id="todo-input" name="todo" type="text" maxlength="128"
         autocomplete="off" aria-describedby="status" required>
  <div role="group" aria-label="Task actions">
    <button id="add" type="button">Add task</button>
    <button id="complete" type="button">Complete task</button>
    <button id="remove" type="button">Remove task</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="summary" aria-live="polite"></p>
  <h2>Saved tasks</h2>
  <ul id="todo-list" aria-label="Saved tasks"></ul>
</main>
<script type="module" src="./14-todo-app.mjs"></script>
</body>
</html>
