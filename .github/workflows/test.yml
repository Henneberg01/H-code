name: H-Code conformance (M14 verification)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/m14-typed-lambda-glyph
permissions:
  contents: read
jobs:
  conformance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: npm run studio:test
      - run: npm run phase1:test
      - run: npm run compact:test
      - run: cargo test --manifest-path compiler/Cargo.toml
      - run: npm run compact:ts-parity
      - run: npm run m13:measure
      - run: npm run m14:measure
      - run: npm run release:check
