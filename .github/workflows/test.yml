name: H-Code compiler and package conformance (M16.3)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/m16-2-universal-sign-types
      - feat/m16-3-glyph-package-generator
      - feat/m19-canonical20-m163-integration
      - feat/m12-symbolic-records-post-m19
      - feat/m12-typed-json-records
      - feat/m19-canonical05-json-transformation-proof
      - feat/m19-canonical02-fibonacci-proof
      - feat/m19-canonical10-collections-proof
  push:
    branches:
      - main
      - feat/m19-canonical03-unicode-frequency
      - feat/m19-canonical04-csv-validation
      - feat/m19-canonical01-stdin-arithmetic
      - feat/m14-typed-lambda-glyph
      - feat/m15-sign-blocks-delimiters
      - feat/m16-typed-user-signs
      - feat/m16-2-universal-sign-types
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate typed packages from concise H-Code
        run: cargo run --manifest-path compiler/Cargo.toml -- pack --name poly.auto --version 1.0.0 --source packages/poly.auto/signs.hcs --lock hcode.m16.3.lock.json
      - name: Verify deterministic package output
        run: cargo run --manifest-path compiler/Cargo.toml -- pack --name poly.auto --version 1.0.0 --source packages/poly.auto/signs.hcs --lock hcode.m16.3.lock.json --check
      - name: Rust compiled generated package
        run: cargo run --manifest-path compiler/Cargo.toml -- run packages/poly.auto/demo.hc --lock hcode.m16.3.lock.json
      - name: JavaScript reference generated package
        run: node prototype/bin/hcode.mjs run packages/poly.auto/demo.hc --lock hcode.m16.3.lock.json
      - name: Measure authored glyph source and generated bytes
        run: node scripts/m16-3-authoring-metrics.mjs
      # Compile Rust early: JavaScript failures must not conceal compiler failures.
      # Keep test suites independent: one regression must not hide other failures.
      - run: cargo test --manifest-path compiler/Cargo.toml --no-fail-fast
        if: ${{ success() || failure() }}
      - run: npm test
        if: ${{ success() || failure() }}
      - run: npm run studio:test
        if: ${{ success() || failure() }}
      - run: npm run phase1:test
        if: ${{ success() || failure() }}
      - run: npm run compact:test
        if: ${{ success() || failure() }}
      - run: npm run compact:ts-parity
        if: ${{ success() || failure() }}
      - name: Verify M12 frozen records vs idiomatic TypeScript
        run: npm run m12:measure
        if: ${{ success() || failure() }}
      - name: Verify M12 schema-checked JSON roundtrip against TypeScript
        run: npm run m12:json-measure
        if: ${{ success() || failure() }}
      - run: npm run m13:measure
        if: ${{ success() || failure() }}
      - run: npm run m14:measure
        if: ${{ success() || failure() }}
      - run: npm run m15:measure
        if: ${{ success() || failure() }}
      - name: Install exact pinned idiomatic TypeScript CSV comparator packages
        run: npm ci --prefix compact/canonical20/baselines/04-idiomatic-typescript --ignore-scripts --no-audit --no-fund
        if: ${{ success() || failure() }}
      - name: Benchmark independent idiomatic TS csv-parse and Zod parity with package footprint
        run: npm run benchmark20:csv-idiomatic
        if: ${{ success() || failure() }}
      - name: Install fixed mathematical expression library comparator
        run: npm ci --prefix compact/canonical20/baselines/01-idiomatic-typescript --ignore-scripts --no-audit --no-fund
        if: ${{ success() || failure() }}
      - name: Compare exact stdin calculator CLI against maintained TS expression package
        run: npm run benchmark20:calc-idiomatic
        if: ${{ success() || failure() }}
      - name: Verify original canonical01 stdin calculator CLI status stderr and arithmetic semantics
        run: npm run benchmark20:verify01
        if: ${{ success() || failure() }}
      - name: Verify canonical04 CSV parsing, filesystem and typed validation
        run: npm run benchmark20:verify04
        if: ${{ success() || failure() }}
      - name: Verify canonical03 Unicode normalization and frequency in Rust JS TypeScript
        run: npm run benchmark20:verify03
        if: ${{ success() || failure() }}
      - name: Verify complete canonical workload 10 typed sum/map/filter generality
        run: npm run benchmark20:verify10
        if: ${{ success() || failure() }}
      - name: Verify complete original canonical workload 02 with real Rust recursion and TypeScript
        run: npm run benchmark20:verify02
        if: ${{ success() || failure() }}
      - name: Verify complete canonical workload 05 with three independent engines
        run: npm run benchmark20:verify05
        if: ${{ success() || failure() }}
      - name: Verify task06 frozen loopback HTTP fixtures and independent TypeScript baseline
        run: npm run benchmark20:http-contract
        if: ${{ success() || failure() }}
      - name: Verify canonical06 live H-Code retry policy against Rust JS and TypeScript
        run: npm run benchmark20:verify06
        if: ${{ success() || failure() }}
      - name: Verify real parallel three-request HTTP barrier in Rust-generated H-Code
        run: npm run benchmark20:batch08
        if: ${{ success() || failure() }}
      - name: Prove canonical08 six frozen and eight generated real concurrent HTTP scenarios
        run: npm run benchmark20:verify08
        if: ${{ success() || failure() }}
      - name: Prove original canonical07 file conversion and byte-exact Rust JS TypeScript parity
        run: npm run benchmark20:verify07
        if: ${{ success() || failure() }}
      - name: Verify task09 fake-clock TTL cache compiler interpreter and TS parity
        run: npm run benchmark20:verify09
        if: ${{ success() || failure() }}
      - name: Verify task11 Markdown heading and link extraction on six locked fixtures and nineteen generated cases
        run: npm run benchmark20:verify11
        if: ${{ success() || failure() }}
      - name: Validate canonical12 independent CRUD oracle over real HTTP and durable state (B0 only)
        run: npm run benchmark20:contract12
        if: ${{ success() || failure() }}
      - name: M19.12 B1 native typed inbound HTTP serve symbol and independent JS parity
        run: npm run benchmark20:serve12b1
        if: ${{ success() || failure() }}
      - name: M19.12 B2a typed durable HTTP state and independent JS parity (still not CRUD)
        run: npm run benchmark20:state12b2a
        if: ${{ success() || failure() }}
      - name: M19.12 B2b durable request idempotency across restart and concurrent HTTP
        run: npm run benchmark20:state12b2b
        if: ${{ success() || failure() }}
      - name: M19.12 B2c-1 immutable CAS state store real-process crash and concurrency tests
        run: npm run benchmark20:state12b2c1
        if: ${{ success() || failure() }}
      - name: M19.12 B2c-2 CAS reducer retries and idempotent replay
        run: npm run benchmark20:state12b2c2
        if: ${{ success() || failure() }}
      - name: M19.12 B2c-2 Rust-compiled H-Code real HTTP crash and dual-process acceptance
        run: npm run benchmark20:state12b2c2-http
        if: ${{ success() || failure() }}
      - name: M19.12 B2c-3 bounded CAS crash-point fault injection and corruption tests
        run: npm run benchmark20:state12b2c3-fault
        if: ${{ success() || failure() }}
      - name: Canonical twenty source-locked readiness check
        run: npm run benchmark20:status
        if: ${{ success() || failure() }}
      - name: Canonical twenty anti-cherrypick tests
        run: npm run benchmark20:test
        if: ${{ success() || failure() }}
      - run: npm run release:check
        if: ${{ success() || failure() }}
