name: H-Code M1 + M2 Conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  javascript-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
  rust-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path compiler/Cargo.toml
      - run: cargo run --manifest-path compiler/Cargo.toml -- check examples/user_symbols.hc --lock hcode.lock.json
