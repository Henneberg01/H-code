name: H-Code conformance (M14 verification)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/m14-typed-lambda-glyph
      - feat/m15-sign-blocks-delimiters
permissions:
  contents: read
jobs:
  conformance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      # Compile Rust early: JavaScript failures must not conceal compiler failures.
      # Keep test suites independent: one regression must not hide other failures.
      - run: cargo test --manifest-path compiler/Cargo.toml --no-fail-fast
        if: ${{ success() || failure() }}
      - run: npm test
        if: ${{ success() || failure() }}
      - run: npm run studio:test
        if: ${{ success() || failure() }}
      - run: npm run phase1:test
        if: ${{ success() || failure() }}
      - run: npm run compact:test
        if: ${{ success() || failure() }}
      - run: npm run compact:ts-parity
        if: ${{ success() || failure() }}
      - run: npm run m13:measure
        if: ${{ success() || failure() }}
      - run: npm run m14:measure
        if: ${{ success() || failure() }}
      - run: npm run release:check
        if: ${{ success() || failure() }}
