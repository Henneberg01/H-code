name: H-Code compiler and package conformance (M16.3)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/m16-2-universal-sign-types
      - feat/m16-3-glyph-package-generator
      - feat/m19-canonical20-m163-integration
      - feat/m12-symbolic-records-post-m19
      - feat/m12-typed-json-records
      - feat/m19-canonical05-json-transformation-proof
      - feat/m19-canonical02-fibonacci-proof
      - feat/m19-canonical10-collections-proof
  push:
    branches:
      - main
      - feat/m19-canonical03-unicode-frequency
      - feat/m19-canonical04-csv-validation
      - feat/m19-canonical01-stdin-arithmetic
      - feat/m14-typed-lambda-glyph
      - feat/m15-sign-blocks-delimiters
      - feat/m16-typed-user-signs
      - feat/m16-2-universal-sign-types
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate typed packages from concise H-Code
        run: cargo run --manifest-path compiler/Cargo.toml -- pack --name poly.auto --version 1.0.0 --source packages/poly.auto/signs.hcs --lock hcode.m16.3.lock.json
      - name: Verify deterministic package output
        run: cargo run --manifest-path compiler/Cargo.toml -- pack --name poly.auto --version 1.0.0 --source packages/poly.auto/signs.hcs --lock hcode.m16.3.lock.json --check
      - name: Rust compiled generated package
        run: cargo run --manifest-path compiler/Cargo.toml -- run packages/poly.auto/demo.hc --lock hcode.m16.3.lock.json
      - name: JavaScript reference generated package
        run: node prototype/bin/hcode.mjs run packages/poly.auto/demo.hc --lock hcode.m16.3.lock.json
      - name: Measure authored glyph source and generated bytes
        run: node scripts/m16-3-authoring-metrics.mjs
      # Compile Rust early: JavaScript failures must not conceal compiler failures.
      # Keep test suites independent: one regression must not hide other failures.
      - run: cargo test --manifest-path compiler/Cargo.toml --no-fail-fast
        if: ${{ success() || failure() }}
      - run: npm test
        if: ${{ success() || failure() }}
      - run: npm run studio:test
        if: ${{ success() || failure() }}
      - run: npm run phase1:test
        if: ${{ success() || failure() }}
      - run: npm run compact:test
        if: ${{ success() || failure() }}
      - run: npm run compact:ts-parity
        if: ${{ success() || failure() }}
      - name: Verify M12 frozen records vs idiomatic TypeScript
        run: npm run m12:measure
        if: ${{ success() || failure() }}
      - name: Verify M12 schema-checked JSON roundtrip against TypeScript
        run: npm run m12:json-measure
        if: ${{ success() || failure() }}
      - run: npm run m13:measure
        if: ${{ success() || failure() }}
      - run: npm run m14:measure
        if: ${{ success() || failure() }}
      - run: npm run m15:measure
        if: ${{ success() || failure() }}
      - name: Install exact pinned idiomatic TypeScript CSV comparator packages
        run: npm ci --prefix compact/canonical20/baselines/04-idiomatic-typescript --ignore-scripts --no-audit --no-fund
        if: ${{ success() || failure() }}
      - name: Benchmark independent idiomatic TS csv-parse and Zod parity with package footprint
        run: npm run benchmark20:csv-idiomatic
        if: ${{ success() || failure() }}
      - name: Verify original canonical01 stdin calculator CLI status stderr and arithmetic semantics
        run: npm run benchmark20:verify01
        if: ${{ success() || failure() }}
      - name: Verify canonical04 CSV parsing, filesystem and typed validation
        run: npm run benchmark20:verify04
        if: ${{ success() || failure() }}
      - name: Verify canonical03 Unicode normalization and frequency in Rust JS TypeScript
        run: npm run benchmark20:verify03
        if: ${{ success() || failure() }}
      - name: Verify complete canonical workload 10 typed sum/map/filter generality
        run: npm run benchmark20:verify10
        if: ${{ success() || failure() }}
      - name: Verify complete original canonical workload 02 with real Rust recursion and TypeScript
        run: npm run benchmark20:verify02
        if: ${{ success() || failure() }}
      - name: Verify complete canonical workload 05 with three independent engines
        run: npm run benchmark20:verify05
        if: ${{ success() || failure() }}
      - name: Canonical twenty source-locked readiness check
        run: npm run benchmark20:status
        if: ${{ success() || failure() }}
      - name: Canonical twenty anti-cherrypick tests
        run: npm run benchmark20:test
        if: ${{ success() || failure() }}
      - run: npm run release:check
        if: ${{ success() || failure() }}
