name: JFH-CODE M19 relational ⧈ native parity
on:
  push:
    branches: ['feat/m19-relational-*']
  pull_request:
    branches: [main, 'feat/m19-typed-record-table-mainline']
permissions:
  contents: read
jobs:
  relational:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust native glyph and 2-vs-3 operand parser/typechecker tests
        run: cargo test --manifest-path compiler/Cargo.toml --test m19_db_rows --test m19_dom_table --test m19_symbol_sort
      - name: Disk-backed SQLite and independent JFH-CODE/idiomatic TypeScript parity
        run: node --experimental-sqlite --experimental-strip-types --test scripts/m19-db-rows.test.mjs
      - name: Existing semantic tables and effect-safe sort regression
        run: node --test scripts/m19-dom-table.test.mjs scripts/m19-symbol-sort.test.mjs
      - name: Global sign-first source audit and frozen legacy corpus
        run: node --test scripts/hcode-symbol-first-audit.test.mjs
