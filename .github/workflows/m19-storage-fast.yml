name: H-Code M19.14 browser storage conformance
on:
  push:
    branches:
      - 'feat/m19-canonical14-*'
permissions:
  contents: read
jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native typed storage and signed-purity Rust checks
        run: cargo test --manifest-path compiler/Cargo.toml --test m19_browser_storage
      - name: Rust-emitted ESM versus H-Code JS interpreter storage parity
        run: npm run m19:browser-storage

  persistent-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Persistent same-origin localStorage over full Chromium restart
        run: npm run m19:browser-storage-real
        env:
          HCODE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
