name: JFH-CODE M19.15 B1 native typed SQLite
on:
  push:
    branches:
      - 'feat/m19-canonical15-*'
  pull_request:
    branches:
      - main
      - 'feat/m19-canonical15-*'
permissions:
  contents: read
jobs:
  db-rows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native typed SQLite lexer parser typechecker and conditional ESM
        run: cargo test --manifest-path compiler/Cargo.toml --test m19_db_rows
      - name: Real SQLite query and independent JFH-CODE interpreter parity
        run: node --experimental-sqlite --experimental-strip-types --test scripts/m19-db-rows.test.mjs
