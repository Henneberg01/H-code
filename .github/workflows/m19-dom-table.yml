name: JFH-CODE M19.15 B2a typed semantic DOM table
on:
  push:
    branches: ['feat/m19-canonical15-*']
  pull_request:
    branches: [main,'feat/m19-canonical15-*']
permissions:
  contents: read
jobs:
  table:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Typed Rust glyph and accessibility parity
        run: cargo test --manifest-path compiler/Cargo.toml --test m19_dom_table
      - name: Independent JFH-CODE JS interpreter and emitted Rust table parity
        run: node --test scripts/m19-dom-table.test.mjs
