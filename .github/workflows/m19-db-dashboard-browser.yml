name: JFH-CODE M19.15 real Chromium dashboard
on:
  push:
    branches: ['feat/m19-canonical15-*']
  pull_request:
    branches: [main,'feat/m19-canonical15-*']
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Rust ESM, SQLite, browser JFH-CODE and exact Chromium DOM traces
        env:
          HCODE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node --experimental-sqlite --experimental-strip-types --test scripts/m19-db-dashboard-browser.test.mjs
